/* Keep menu icons left‑aligned, keep text centred */
.sidebar {
    width: 250px;

    padding: 1rem;

}
/* Form layout */

    padding: 2rem;

.select-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;

.select-group select {

/* Keep the search field value when group changes */
input#search {

}
/* Simple card style for exercise list */

    border: 1px solid #e0e0e0;

<!-- ==== UI Logic ==== -->
<script>
  // Utility: render list of exercises
  function renderList(filterText = "", group = "all") {
    const listContainer = document.getElementById('exercise-list');
    listContainer.innerHTML = '';
    const filtered = EXERCISES.filter(item => {
      const matchesGroup = group === 'all' || item.group === group;
      const matchesText = item.name.toLowerCase().includes(filterText.toLowerCase());
      return matchesGroup && matchesText;
    });
    if (filtered.length === 0) {
      listContainer.innerHTML = '<p>Hiç hareket bulunamadı.</p>';
      return;
    }
    filtered.forEach(item => {
      const div = document.createElement('div');
      div.className = 'exercise-card';
      div.textContent = item.name;
      // Click handler to add to Firebase (simple example)
      div.onclick = () => addExercise(item);
      listContainer.appendChild(div);
    });
  }
  // Add selected exercise to Firebase (you can adapt the data structure)
  function addExercise(ex) {
    const newKey = db.ref('exercises').push().key;
    db.ref('exercises/' + newKey).set({
      name: ex.name,
      group: ex.group,
      addedAt: Date.now()
    }).then(() => {
      alert(`“${ex.name}” eklendi!`);
    }).catch(err => {
      console.error(err);
      alert('Ekleme sırasında bir hata oluştu.');
    });
  }
  // ----- Event listeners -----
  // Keep search text intact when group changes
  const searchInput = document.getElementById('search');
  const groupSelect = document.getElementById('muscle-group');
  searchInput.addEventListener('input', () => {
    renderList(searchInput.value, groupSelect.value);
  });
  groupSelect.addEventListener('change', () => {
    // Do NOT clear the search box – just re‑render with the same text
    renderList(searchInput.value, groupSelect.value);
  });
  // Initial render – “Hepsi” is already selected
  renderList();
</script>
