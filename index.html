<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness & Body Records</title>
    <!-- Firebase SDK (v9/v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-primary: #0a0f1d;
            --bg-secondary: #161f33;
            --bg-card: #1e2942;
            --neon-green: #00ff88;
            --neon-cyan: #00e5ff;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #2a3b5c;
            --danger: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        header {
            background-color: var(--bg-primary);
            padding: 20px 15px 15px 15px;
            text-align: center;
            border-bottom: 2px solid var(--neon-green);
        }

        header h1 {
            font-size: 1.4rem;
            color: var(--neon-green);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        header p {
            font-size: 0.75rem;
            color: var(--neon-cyan);
            margin-top: 5px;
            font-weight: 600;
        }

        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: rgba(0,0,0,0.2);
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border-color);
        }

        .user-bar span {
            color: var(--neon-cyan);
            font-weight: bold;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .main-content {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            padding-bottom: 80px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 1.1rem;
            color: var(--neon-green);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--neon-green);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .btn-neon {
            background-color: var(--neon-green);
            color: #000;
        }

        .btn-neon:hover {
            box-shadow: 0 0 10px var(--neon-green);
        }

        .btn-sync {
            background-color: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-sync.active-sync {
            background-color: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 12px var(--neon-cyan);
        }

        .btn-sync:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: var(--border-color);
            color: var(--text-muted);
            box-shadow: none;
        }

        .exercise-item {
            background: var(--bg-primary);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid var(--neon-cyan);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .set-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr;
            gap: 8px;
        }

        .set-inputs input {
            padding: 6px;
            text-align: center;
        }

        nav.bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: var(--bg-primary);
            display: flex;
            border-top: 1px solid var(--border-color);
        }

        .nav-item {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.75rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--neon-green);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            width: 90%;
            max-width: 400px;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--neon-green);
        }

        .history-list {
            list-style: none;
        }

        .history-item {
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Fitness & Body Records</h1>
        <p>Tahmin Etmeyi Bırak, Gelişimini Ölç</p>
    </header>

    <div class="user-bar" id="userBar" style="display: none;">
        <div>Sporcu: <span id="currentUserName">-</span></div>
        <button class="logout-btn" onclick="logout()">Çıkış Yap</button>
    </div>

    <div class="main-content">
        <!-- SAYFA 1: Giriş ve Kayıt -->
        <div id="page1" class="page active">
            <div class="card">
                <h2>Giriş Yap</h2>
                <div class="form-group">
                    <label>Telefon Numarası</label>
                    <input type="tel" id="loginPhone" class="form-control" placeholder="+90 5XX XXX XX XX">
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Beni Hatırla</label>
                </div>
                <button class="btn btn-neon" style="margin-top: 12px;" onclick="login()">Giriş Yap</button>
                <button class="btn" style="background: transparent; color: var(--neon-cyan); margin-top: 8px;" onclick="openModal('registerModal')">Yeni Sporcu Ekle</button>
                <button class="btn" style="background: transparent; color: var(--text-muted); font-size:0.75rem; margin-top: 4px;" onclick="openModal('forgotModal')">Numaramı Değiştirdim / Hesabımı Kurtar</button>
            </div>
        </div>

        <!-- SAYFA 2: Günlük Antrenman (Egzersiz Takibi) -->
        <div id="page2" class="page">
            <button id="syncBtn" class="btn btn-sync" onclick="syncToCloud()" disabled>
                <span>☁️ Şimdi Senkronize Et</span>
            </button>
            <div style="font-size: 0.7rem; color: var(--text-muted); text-align: center; margin-top: -10px; margin-bottom: 12px;" id="syncStatus">
                Veriler güncel.
            </div>

            <div class="card">
                <h2>Program Seç</h2>
                <select id="programSelect" class="form-control" onchange="loadExercises()">
                    <option value="">Program Seçiniz...</option>
                </select>
            </div>

            <div id="exerciseContainer"></div>
        </div>

        <!-- SAYFA 3: Sağlık Ölçümleri & Geçmiş -->
        <div id="page3" class="page">
            <div class="card">
                <h2>Yeni Vücut Ölçümü Kaydet</h2>
                <div class="form-group">
                    <label>Kilo (kg)</label>
                    <input type="number" id="mWeight" class="form-control" step="0.1" placeholder="Örn: 78.5">
                </div>
                <div class="form-group">
                    <label>Yağ Oranı (%)</label>
                    <input type="number" id="mFat" class="form-control" step="0.1" placeholder="Örn: 15.2">
                </div>
                <button class="btn btn-neon" onclick="saveMeasurement()">Ölçümü Kaydet</button>
            </div>

            <div class="card">
                <h2>Ölçüm Geçmişi</h2>
                <ul class="history-list" id="measurementHistory"></ul>
            </div>
        </div>
    </div>

    <nav class="bottom-nav" id="bottomNav" style="display: none;">
        <div class="nav-item active" onclick="switchPage('page2', this)">
            <span>🏋️‍♂️</span>
            <span>Antrenman</span>
        </div>
        <div class="nav-item" onclick="switchPage('page3', this)">
            <span>📊</span>
            <span>Sağlık & Geçmiş</span>
        </div>
    </nav>
</div>

<!-- MODAL: Yeni Kayıt -->
<div class="modal" id="registerModal">
    <div class="modal-content">
        <h2 style="color: var(--neon-green); margin-bottom: 12px;">Yeni Sporcu Kaydı</h2>
        <div class="form-group">
            <label>Ad Soyad</label>
            <input type="text" id="regName" class="form-control" placeholder="Adınız Soyadınız">
        </div>
        <div class="form-group">
            <label>Telefon (+90 5XX...)</label>
            <input type="tel" id="regPhone" class="form-control" placeholder="+90 5XX XXX XX XX">
        </div>
        <div class="form-group">
            <label>Güvenlik Sorusu (Kurtarma İçin)</label>
            <select id="regSecQuestion" class="form-control">
                <option value="İlk evcil hayvanınızın adı?">İlk evcil hayvanınızın adı?</option>
                <option value="En sevdiğiniz ilkokul öğretmeniniz?">En sevdiğiniz ilkokul öğretmeniniz?</option>
                <option value="Doğduğunuz şehir?">Doğduğunuz şehir?</option>
            </select>
        </div>
        <div class="form-group">
            <label>Güvenlik Cevabı</label>
            <input type="text" id="regSecAnswer" class="form-control" placeholder="Yanıtınız">
        </div>
        <button class="btn btn-neon" onclick="register()">Kayıt Ol</button>
        <button class="btn" style="background: transparent; color: var(--danger); margin-top: 8px;" onclick="closeModal('registerModal')">İptal</button>
    </div>
</div>

<!-- MODAL: Kurtarma -->
<div class="modal" id="forgotModal">
    <div class="modal-content">
        <h2 style="color: var(--neon-cyan); margin-bottom: 12px;">Hesap Kurtarma</h2>
        <div class="form-group">
            <label>Kayıtlı Ad Soyad</label>
            <input type="text" id="recName" class="form-control">
        </div>
        <div class="form-group">
            <label>Güvenlik Sorusu</label>
            <select id="recSecQuestion" class="form-control">
                <option value="İlk evcil hayvanınızın adı?">İlk evcil hayvanınızın adı?</option>
                <option value="En sevdiğiniz ilkokul öğretmeniniz?">En sevdiğiniz ilkokul öğretmeniniz?</option>
                <option value="Doğduğunuz şehir?">Doğduğunuz şehir?</option>
            </select>
        </div>
        <div class="form-group">
            <label>Güvenlik Cevabı</label>
            <input type="text" id="recSecAnswer" class="form-control">
        </div>
        <div class="form-group">
            <label>Yeni Telefon Numarası</label>
            <input type="tel" id="recNewPhone" class="form-control" placeholder="+90 5XX XXX XX XX">
        </div>
        <button class="btn btn-neon" onclick="recoverAccount()">Numaramı Güncelle & Giriş Yap</button>
        <button class="btn" style="background: transparent; color: var(--danger); margin-top: 8px;" onclick="closeModal('forgotModal')">İptal</button>
    </div>
</div>

<script>
    // -----------------------------------------------------------------
    // 1. FIREBASE CONFIG & INITIALIZATION
    // -----------------------------------------------------------------
    const firebaseConfig = {
        apiKey: "AIzaSyC6IVVpFoZuawKLHVT8R3wXhp3XUnTqaFE",
        authDomain: "fitness-8ecf7.firebaseapp.com",
        projectId: "fitness-8ecf7",
        storageBucket: "fitness-8ecf7.firebasestorage.app",
        messagingSenderId: "1088852669752",
        appId: "1:1088852669752:web:00b29e784caa74003f7dcd",
        measurementId: "G-XMLE2VD01Z"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // -----------------------------------------------------------------
    // 2. STATE & SAMPLE DATA
    // -----------------------------------------------------------------
    let currentUser = null;
    let hasUnsavedChanges = false;

    const samplePrograms = [
        {
            id: 'p1',
            name: 'Göğüs & Triceps (Hipertrofi)',
            exercises: ['Bench Press', 'Incline Dumbbell Press', 'Cable Crossover', 'Triceps Pushdown', 'Seated Dip']
        },
        {
            id: 'p2',
            name: 'Sırt & Biceps (Güç)',
            exercises: ['Lat Pulldown', 'Dumbbell Row', 'T-Bar Row', 'Barbell Curl', 'Hammer Curl']
        },
        {
            id: 'p3',
            name: 'Bacak & Omuz',
            exercises: ['Squat', 'Leg Press', 'Overhead Press', 'Lateral Raise']
        }
    ];

    // Initialize LocalStorage Structure if empty
    if (!localStorage.getItem('fbr_users_db')) {
        localStorage.setItem('fbr_users_db', JSON.stringify([]));
    }

    // Auto-fill Remembered User
    window.onload = () => {
        const rememberedPhone = localStorage.getItem('fbr_remembered_phone');
        if (rememberedPhone) {
            document.getElementById('loginPhone').value = rememberedPhone;
            document.getElementById('rememberMe').checked = true;
        }
    };

    // -----------------------------------------------------------------
    // 3. AUTHENTICATION & SECURITY
    // -----------------------------------------------------------------
    function formatPhone(phone) {
        let cleaned = phone.replace(/\D/g, '');
        if (cleaned.startsWith('90')) cleaned = cleaned.substring(2);
        if (cleaned.startsWith('0')) cleaned = cleaned.substring(1);
        return '+90 ' + cleaned;
    }

    function register() {
        const name = document.getElementById('regName').value.trim();
        const rawPhone = document.getElementById('regPhone').value.trim();
        const q = document.getElementById('regSecQuestion').value;
        const a = document.getElementById('regSecAnswer').value.trim().toLowerCase();

        if (!name || !rawPhone || !a) {
            alert("Lütfen tüm alanları doldurunuz.");
            return;
        }

        const phone = formatPhone(rawPhone);
        let users = JSON.parse(localStorage.getItem('fbr_users_db'));

        if (users.find(u => u.phone === phone)) {
            alert("Bu telefon numarası zaten kayıtlı!");
            return;
        }

        const newUser = {
            id: 'usr_' + Date.now(),
            name: name,
            phone: phone,
            secQuestion: q,
            secAnswer: a,
            measurements: [],
            workoutLogs: []
        };

        users.push(newUser);
        localStorage.setItem('fbr_users_db', JSON.stringify(users));
        alert("Kayıt başarılı! Giriş yapabilirsiniz.");
        closeModal('registerModal');
        document.getElementById('loginPhone').value = phone;
    }

    function login() {
        const rawPhone = document.getElementById('loginPhone').value.trim();
        if (!rawPhone) {
            alert("Lütfen telefon numaranızı girin.");
            return;
        }

        const phone = formatPhone(rawPhone);
        let users = JSON.parse(localStorage.getItem('fbr_users_db'));
        const user = users.find(u => u.phone === phone);

        if (!user) {
            alert("Kullanıcı bulunamadı. Lütfen kayıt olun.");
            return;
        }

        if (document.getElementById('rememberMe').checked) {
            localStorage.setItem('fbr_remembered_phone', phone);
        } else {
            localStorage.removeItem('fbr_remembered_phone');
        }

        currentUser = user;
        document.getElementById('currentUserName').innerText = currentUser.name;
        document.getElementById('userBar').style.display = 'flex';
        document.getElementById('bottomNav').style.display = 'flex';

        initPrograms();
        renderMeasurements();
        switchPage('page2', document.querySelectorAll('.nav-item')[0]);
    }

    function recoverAccount() {
        const name = document.getElementById('recName').value.trim();
        const q = document.getElementById('recSecQuestion').value;
        const a = document.getElementById('recSecAnswer').value.trim().toLowerCase();
        const newRawPhone = document.getElementById('recNewPhone').value.trim();

        if (!name || !a || !newRawPhone) {
            alert("Lütfen tüm alanları doldurunuz.");
            return;
        }

        let users = JSON.parse(localStorage.getItem('fbr_users_db'));
        const userIndex = users.findIndex(u => u.name.toLowerCase() === name.toLowerCase() && u.secQuestion === q && u.secAnswer === a);

        if (userIndex === -1) {
            alert("Güvenlik bilgileri eşleşmedi!");
            return;
        }

        users[userIndex].phone = formatPhone(newRawPhone);
        localStorage.setItem('fbr_users_db', JSON.stringify(users));
        alert("Telefon numaranız başarıyla güncellendi! Yeni numaranızla giriş yapabilirsiniz.");
        closeModal('forgotModal');
        document.getElementById('loginPhone').value = users[userIndex].phone;
    }

    function logout() {
        currentUser = null;
        document.getElementById('userBar').style.display = 'none';
        document.getElementById('bottomNav').style.display = 'none';
        switchPage('page1');
    }

    // -----------------------------------------------------------------
    // 4. WORKOUT & MEASUREMENT LOGIC
    // -----------------------------------------------------------------
    function initPrograms() {
        const select = document.getElementById('programSelect');
        select.innerHTML = '<option value="">Program Seçiniz...</option>';
        samplePrograms.forEach(p => {
            select.innerHTML += `<option value="${p.id}">${p.name}</option>`;
        });
    }

    function loadExercises() {
        const progId = document.getElementById('programSelect').value;
        const container = document.getElementById('exerciseContainer');
        container.innerHTML = '';

        if (!progId) return;

        const prog = samplePrograms.find(p => p.id === progId);
        prog.exercises.forEach((ex, idx) => {
            container.innerHTML += `
                <div class="exercise-item">
                    <div class="exercise-header">
                        <span>${ex}</span>
                    </div>
                    <div class="set-inputs">
                        <input type="number" id="weight_${idx}" placeholder="Kg" class="form-control" min="0">
                        <input type="number" id="reps_${idx}" placeholder="Tekrar" class="form-control" min="0">
                        <button class="btn btn-neon" onclick="saveSet('${ex}', ${idx})">Seti Kaydet</button>
                    </div>
                </div>
            `;
        });
    }

    function saveSet(exName, idx) {
        const w = document.getElementById(`weight_${idx}`).value;
        const r = document.getElementById(`reps_${idx}`).value;

        if (!w || !r || w < 0 || r < 0) {
            alert("Lütfen geçerli kilo ve tekrar giriniz.");
            return;
        }

        const logEntry = {
            date: new Date().toISOString(),
            exercise: exName,
            weight: parseFloat(w),
            reps: parseInt(r)
        };

        currentUser.workoutLogs.push(logEntry);
        updateCurrentUserInStorage();
        triggerUnsavedState();

        alert(`${exName} için ${w}kg x ${r} tekrar kaydedildi.`);
        document.getElementById(`weight_${idx}`).value = '';
        document.getElementById(`reps_${idx}`).value = '';
    }

    function saveMeasurement() {
        const w = document.getElementById('mWeight').value;
        const f = document.getElementById('mFat').value;

        if (!w || w <= 0) {
            alert("Lütfen geçerli bir kilo giriniz.");
            return;
        }

        const entry = {
            date: new Date().toLocaleDateString('tr-TR'),
            weight: parseFloat(w),
            fat: f ? parseFloat(f) : null
        };

        currentUser.measurements.unshift(entry);
        updateCurrentUserInStorage();
        triggerUnsavedState();
        renderMeasurements();

        document.getElementById('mWeight').value = '';
        document.getElementById('mFat').value = '';
    }

    function renderMeasurements() {
        const list = document.getElementById('measurementHistory');
        list.innerHTML = '';
        if (!currentUser || !currentUser.measurements) return;

        currentUser.measurements.forEach(m => {
            list.innerHTML += `
                <li class="history-item">
                    <span><strong>${m.date}</strong></span>
                    <span>${m.weight} kg ${m.fat ? '(%'+m.fat+' yağ)' : ''}</span>
                </li>
            `;
        });
    }

    function updateCurrentUserInStorage() {
        let users = JSON.parse(localStorage.getItem('fbr_users_db'));
        const idx = users.findIndex(u => u.id === currentUser.id);
        if (idx !== -1) {
            users[idx] = currentUser;
            localStorage.setItem('fbr_users_db', JSON.stringify(users));
        }
    }

    // -----------------------------------------------------------------
    // 5. FIREBASE SYNC ENGINE
    // -----------------------------------------------------------------
    function triggerUnsavedState() {
        hasUnsavedChanges = true;
        const syncBtn = document.getElementById('syncBtn');
        const syncStatus = document.getElementById('syncStatus');

        syncBtn.disabled = false;
        syncBtn.classList.add('active-sync');
        syncStatus.innerText = "Yerel verilerde güncellemeler var. Buluta aktarılmaya hazır.";
        syncStatus.style.color = "var(--neon-cyan)";
    }

    async function syncToCloud() {
        if (!currentUser) return;
        const syncBtn = document.getElementById('syncBtn');
        const syncStatus = document.getElementById('syncStatus');

        syncBtn.disabled = true;
        syncStatus.innerText = "Buluta aktarılıyor...";

        try {
            // Firestore Sync (Users Collection)
            await db.collection("users").doc(currentUser.id).set({
                id: currentUser.id,
                name: currentUser.name,
                phone: currentUser.phone,
                secQuestion: currentUser.secQuestion,
                measurements: currentUser.measurements,
                workoutLogs: currentUser.workoutLogs,
                lastSyncedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            hasUnsavedChanges = false;
            syncBtn.classList.remove('active-sync');
            syncStatus.innerText = "Tüm verileriniz Google Cloud Firestore ile senkronize edildi.";
            syncStatus.style.color = "var(--neon-green)";
            alert("Bulut Senkronizasyonu Başarılı!");
        } catch (error) {
            console.error("Cloud Sync Error: ", error);
            syncBtn.disabled = false;
            syncStatus.innerText = "Senkronizasyon hatası! Tekrar deneyin.";
            syncStatus.style.color = "var(--danger)";
            alert("Senkronizasyon hatası: " + error.message);
        }
    }

    // -----------------------------------------------------------------
    // 6. UI & NAVIGATION UTILS
    // -----------------------------------------------------------------
    function switchPage(pageId, navEl) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');

        if (navEl) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            navEl.classList.add('active');
        }
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
</script>
</body>
</html>
